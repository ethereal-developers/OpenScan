plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '6'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '3.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.ethereal.openscan"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ethereal.openscan"
        minSdk flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }
   buildTypes {
       release {
           signingConfig signingConfigs.release
           minifyEnabled true
           proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
               'proguard-rules.pro'
       }
   }
}

flutter {
    source '../..'
}

dependencies {
    // Tesseract's LSTM engine, built for Android by the Tesseract4Android
    // project (Apache-2.0). Bound directly rather than through a pub
    // plugin: flutter_tesseract_ocr wraps this same library, but its Gradle
    // script is AGP 7-era -- it calls jcenter() and compileSdkVersion from
    // its own buildscript, neither of which survives AGP 9 -- so the plugin
    // cannot be evaluated by this build at all. See OcrChannel.kt for the
    // binding this replaces it with.
    //
    // The non-openmp variant: OpenMP buys parallelism within a single page,
    // but pages are already recognized one-per-background-thread off the
    // platform thread, and the openmp build has a history of crashing on
    // some ARM devices when its thread pool is torn down.
    implementation 'com.github.adaptech-cz.Tesseract4Android:tesseract4android:4.8.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
}
