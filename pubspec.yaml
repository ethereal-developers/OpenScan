name: openscan
description: An open source app that enables users to scan hardcopies of
  documents or notes and covert it to a PDF file. No ads, privacy is of the
  utmost importance.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 3.0.0+6

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  bloc: ^8.1.0
  camera: ^0.12.0
  camera_platform_interface: ^2.9.0
  cupertino_icons:
  exif:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.1
  # flutter_neumorphic: ^3.1.0
  flutter_localizations:
    sdk: flutter
  # fluttertoast: ^8.0.8
  image:
  image_picker:
  intl:
  open_filex: ^4.7.0
  path:
  path_provider:
  pdf:
  permission_handler:
  quick_actions:
  reorderables:
  sensors_plus:
  share_plus:
  shared_preferences:
  sqflite:
  url_launcher:
  vector_math: 

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
